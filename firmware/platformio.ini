; Smart Helmet firmware — ESP32 (Arduino framework via PlatformIO)
;
; Phase 2 target (04_PHASES.md): MPU6050 + piezo + FSR + panic button + buzzer,
; sensor reads -> BLE relay matching 02_ARCHITECTURE.md §4.
;
;   pio run                       build for the ESP32
;   pio run -t upload             flash
;   pio device monitor            serial console (115200)
;   pio test -e native            run host unit tests (no board needed)
;
; The safety-critical logic (src/core/) is framework-agnostic C++ so it is
; unit-tested on the host in the `native` env. Anything touching Arduino /
; NimBLE / sensor libraries lives outside src/core/ and is excluded from the
; native build.

[platformio]
default_envs = esp32dev
src_dir = src

[env]
build_flags =
    -DHELMET_FW_VERSION=\"0.1.0-phase2\"
    -std=gnu++17
    -I$PROJECT_DIR/include
    -I$PROJECT_DIR/src
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; NimBLE 1.4.x pairs with arduino-esp32 2.0.x (espressif32 6.x). If you
    ; move to NimBLE 2.x you must also move to espressif32 7.x / pioarduino
    ; AND update the callback signatures in src/ble/gatt_server.cpp.
    h2zero/NimBLE-Arduino@~1.4.3
build_flags =
    ${env.build_flags}
    -DHELMET_TARGET_ESP32=1
build_src_filter = +<*> -<sim/>

; Host unit tests — only src/core/ is compiled here.
[env:native]
platform = native
test_framework = unity
test_build_src = true          ; link the project sources (src/core/) into tests
build_flags =
    ${env.build_flags}
    -DHELMET_TARGET_NATIVE=1
build_src_filter = -<*> +<core/>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

; Desktop simulator — runs the real src/core/ against an IMU-window CSV.
;   pio run -e sim
;   .pio/build/sim/program --csv ../ml/data/damoto_windows.csv --verbose
[env:sim]
platform = native
build_flags =
    ${env.build_flags}
    -DHELMET_TARGET_NATIVE=1
build_src_filter = +<core/> +<sim/>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
